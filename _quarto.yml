project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - assets/fonts/*.woff2
    # D-BIOL nav badge — referenced only from a dynamic <img> injected by JS
    # (include-after-body), so Quarto's static analysis can't see it on its own.
    - assets/d-biol-nav.png
    # Crawler/LLM discoverability files served from the web root.
    - robots.txt          # welcomes search + AI bots, points to sitemap.xml
    - llms.txt            # LLM-facing plain-text summary of the lab

website:
  title: "Zindel Lab"
  description: "Intravital imaging of tissue repair, fibrosis, and post-surgical adhesions — Zindel Lab, ETH Zürich (D-BIOL)."
  site-url: https://zindellab.ch
  favicon: assets/favicon.png
  open-graph:
    image: /assets/og-card.png
    locale: en_US
  twitter-card:
    image: /assets/og-card.png
    card-style: summary_large_image
  navbar:
    background: "#000"
    pinned: true
    logo: assets/logo.webp
    logo-alt: "Zindel Lab — ETH Zürich"
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: people.qmd
        text: People
      - href: gallery.qmd
        text: Gallery
      - href: publications.qmd
        text: Publications
      - href: jobs.qmd
        text: Job Opportunities
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/TizzuLab/zindellab
        aria-label: GitHub
  page-footer:
    background: "#000"
    left: "© 2026 Zindel Lab · ETH Zürich"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - darkly
      - theme-dark.scss
    toc: false
    code-link: true
    grid:
      body-width: 900px
    link-external-newwindow: true
    # Schema.org JSON-LD entity metadata + Cloudflare Web Analytics beacon —
    # see each file's header for rationale.
    include-in-header:
      - _head-structured-data.html
      - _head-analytics.html
    include-after-body:
      text: |
        <script>
        document.addEventListener('DOMContentLoaded', () => {
          const nav = document.querySelector('.navbar .navbar-container');
          if (!nav) return;
          const make = (cls) => {
            const a = document.createElement('a');
            a.href = 'https://biol.ethz.ch';
            a.className = 'dbiol-mark ' + cls;
            a.target = '_blank';
            a.rel = 'noopener';
            a.setAttribute('aria-label', 'D-BIOL — ETH Department of Biology');
            a.innerHTML = '<img src="/assets/d-biol-nav.png" alt="D-BIOL">';
            return a;
          };
          // Mobile copy: lives inside the brand container so it sits right
          // next to the lab logo regardless of where the brand ends up.
          const brand = nav.querySelector('.navbar-brand-container');
          if (brand) brand.appendChild(make('dbiol-mark-mobile'));
          // Desktop copy: flex sibling of brand/toggler/collapse, pushed
          // to the far right by `order: 999` in CSS.
          const toggler = nav.querySelector('.navbar-toggler');
          (toggler ? (el) => nav.insertBefore(el, toggler) : (el) => nav.appendChild(el))(make('dbiol-mark-desktop'));
        });
        </script>
